<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563EB; --primary-dark:#1D4ED8; --primary-soft:#EAF1FE;
  --accent:#059669; --accent-soft:#E3F6EE; --warn:#B45309; --warn-soft:#FEF3C7;
  --danger:#DC2626; --danger-soft:#FDE8E8;
  --bg:#F8FAFC; --card:#FFFFFF; --fg:#0F172A; --muted:#475569; --muted-bg:#F1F5F9; --border:#DDE5F0;
  --radius:10px; --side:244px;
  --font:'Fira Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Fira Code',ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono)}
.right{text-align:right}

/* botones */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-weight:500;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--muted-bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.green{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.green:hover{background:#047857}
.btn.danger{color:var(--danger);border-color:#F5C2C2}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn.icon{width:40px;padding:0;justify-content:center}
.btn.sm.icon{width:34px}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* formularios */
label.f{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:12px}
label.f>span{display:block;margin-bottom:4px}
input,select,textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.err{background:var(--danger-soft);color:#991B1B;border-radius:8px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:18px}
.brand .logo{width:36px;height:36px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center}
.tabs{display:flex;background:var(--muted-bg);border-radius:9px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;border-radius:6px;min-height:36px;font-weight:500;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--fg);box-shadow:0 0 0 1px var(--border)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.role{border:1.5px solid var(--border);border-radius:10px;padding:12px;text-align:left;background:#fff}
.role.on{border-color:var(--primary);background:var(--primary-soft)}
.role b{display:block} .role span{font-size:12.5px;color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border:0;background:transparent;border-radius:8px;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--muted-bg);color:var(--fg)}
.nav button.on{background:var(--primary-soft);color:var(--primary-dark)}
.nav .badge{margin-left:auto}
.badge{background:var(--danger);color:#fff;border-radius:999px;font-size:11.5px;font-weight:600;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center}
.side .me{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top .grow{flex:1;min-width:0}
.top .burger{display:none}
.content{padding:24px;max-width:1400px}
.pagehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--muted-bg);color:var(--muted)}
.pill.blue{background:var(--primary-soft);color:var(--primary-dark)}
.pill.green{background:var(--accent-soft);color:#047857}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.red{background:var(--danger-soft);color:#B91C1C}

/* tarjetas */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card>h2{margin-bottom:12px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(176px,1fr));margin-bottom:16px}
.kpi{padding:16px}
.kpi .l{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--mono);font-weight:600;font-size:22px;margin-top:6px;overflow-wrap:anywhere}
.kpi.g .v{color:#047857} .kpi.b .v{color:var(--primary-dark)}
.cols2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.chartbox{position:relative;height:250px}

/* tablas */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--muted-bg);text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:#F8FAFF}
td.num,th.num{text-align:right;font-family:var(--mono)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar>*{width:auto}
.toolbar select,.toolbar input{min-width:150px}
.toolbar .grow{flex:1;min-width:180px}

/* calendario */
.calhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.calhead .ttl{font-weight:600;font-size:16px;min-width:160px}
.calhead .ttl::first-letter{text-transform:uppercase}
.seg{display:inline-flex;background:var(--muted-bg);border-radius:8px;padding:3px;margin-left:auto}
.seg button{border:0;background:transparent;border-radius:6px;min-height:32px;padding:0 12px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--fg);box-shadow:0 0 0 1px var(--border)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff}
.cal .dow{background:var(--muted-bg);padding:8px;font-size:12.5px;font-weight:600;color:var(--muted);text-align:center}
.cal .day{min-height:108px;border-top:1px solid var(--border);border-left:1px solid var(--border);padding:4px;display:flex;flex-direction:column;gap:3px;background:#fff;text-align:left;cursor:pointer}
.cal .day:nth-child(7n+8){border-left:0}
.cal .day.out{background:#FAFBFD;color:#94A3B8}
.cal .day .n{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal .day.today .n{background:var(--primary);color:#fff}
.cal.week .day{min-height:260px}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:5px;padding:2px 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c,#2563EB) 16%,#fff);color:var(--fg);border-left:3px solid var(--c,#2563EB)}
.chip.venta{font-weight:600}
.chip.cancelada{text-decoration:line-through;opacity:.6}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c,#2563EB);flex:none;display:inline-block}
.more{font-size:12px;color:var(--muted);padding:0 4px}
.dayview{display:grid;gap:10px}
.appt{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;border:1px solid var(--border);border-left:5px solid var(--c,var(--primary));border-radius:var(--radius);background:#fff;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.appt.cancelada{opacity:.7}
.appt .t{font-family:var(--mono);font-weight:600}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:16px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;padding:22px}
.modal.wide{max-width:680px}
.modal .mh{display:flex;align-items:center;margin-bottom:14px}
.modal .mh h2{flex:1}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px;margin-bottom:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:200}
.toast{background:var(--fg);color:#fff;padding:11px 16px;border-radius:9px;font-size:14px;max-width:340px}
.toast.err{background:#B91C1C}
.notif{display:flex;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;width:100%;text-align:left}
.notif.unread{border-left:4px solid var(--primary);background:#F8FAFF}
.notif+.notif{margin-top:8px}
.code{font-family:var(--mono);font-weight:600;letter-spacing:.06em;background:var(--primary-soft);color:var(--primary-dark);padding:4px 10px;border-radius:7px}
.kpi.click{cursor:pointer;text-align:left;width:100%;display:block;transition:border-color .15s,background .15s}
.kpi.click:hover{border-color:var(--primary);background:#F8FAFF}
.kpi .go{margin-left:auto;color:var(--primary)}
.banner:not(:empty){padding:10px 24px;font-size:14px;display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-bottom:1px solid #FCD34D}
.hist{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.hist-head,.hist-row{display:grid;grid-template-columns:minmax(110px,1.1fr) 112px 1.8fr 20px;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 14px}
.hist-head{background:var(--muted-bg);font-size:12.5px;font-weight:600;color:var(--muted)}
.hist-row{border:0;border-top:1px solid var(--border);background:#fff}
.hist-row:hover{background:#F8FAFF}
.hist-row .chev{color:var(--muted)}
.chat{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 150px);min-height:460px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.clist{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.clist .search{padding:10px;border-bottom:1px solid var(--border)}
.clist .items{overflow-y:auto;flex:1}
.citem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:11px 14px;border-bottom:1px solid #EEF2F7}
.citem:hover{background:var(--muted-bg)} .citem.on{background:var(--primary-soft)}
.av{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:600;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:32px;height:32px;font-size:13px} .av.lg{width:84px;height:84px;font-size:28px}
.photo-row{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.grpbox{display:flex;gap:10px;align-items:center;padding:10px;margin:2px 0 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--muted-bg)}
.grpbox .gname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.credit{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:left;padding:18px 24px;margin-top:8px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
.credit .logo-link{flex:none;border-radius:10px;line-height:0;transition:transform .15s}
.credit .logo-link:hover{transform:scale(1.06)}
.credit img{width:46px;height:46px;display:block}
.credit b{color:var(--fg);font-weight:600}
.auth-card .credit{margin-top:18px;padding:16px 0 0}
.av.grp{background:var(--accent)}
.citem .meta{flex:1;min-width:0;display:block}
.citem .nm{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.citem .pv{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.citem .pv .tx{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cpane{display:flex;flex-direction:column;min-width:0;min-height:0;background:#EFEAE2}
.chead{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--border)}
.cmsgs{flex:1;overflow-y:auto;padding:14px 5%;display:flex;flex-direction:column;gap:4px}
.day-sep{align-self:center;background:#fff;color:var(--muted);font-size:12px;padding:3px 10px;border-radius:8px;margin:8px 0;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bub{max-width:min(520px,82%);padding:7px 10px 5px;border-radius:9px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.1);overflow-wrap:anywhere;white-space:pre-wrap;align-self:flex-start}
.bub.me{background:#D9FDD3;align-self:flex-end}
.bub .who{font-size:12.5px;font-weight:600;color:var(--primary-dark)}
.bub .tm{font-size:11px;color:var(--muted);text-align:right;margin-top:2px;white-space:nowrap}
.bub .tick{color:#94A3B8;margin-left:4px} .bub .tick.read{color:#2563EB}
.refc{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--primary);background:rgba(15,23,42,.06);border-radius:6px;padding:6px 8px;margin-bottom:5px;white-space:normal}
.compose{display:flex;gap:8px;padding:10px;background:#F0F2F5;align-items:flex-end}
.compose textarea{min-height:42px;max-height:130px;border-radius:21px;padding:10px 14px;resize:none}
.cempty{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.chat .back{display:none}
.scrim{display:none}
.ok{background:var(--accent-soft);color:#065F46;border-radius:8px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.linkbtn{border:0;background:none;color:var(--primary-dark);font-weight:500;padding:0;text-decoration:underline;cursor:pointer;text-align:left}
.btn[aria-disabled=true]{opacity:.75;cursor:not-allowed;pointer-events:none}
.done-banner{display:flex;gap:12px;align-items:center;background:var(--accent-soft);color:#065F46;border:1px solid #A7E3CB;border-radius:10px;padding:10px 14px;margin-bottom:12px}
.done-banner .tick-c{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;animation:pop .45s ease-out}
.done-banner .tick-c svg{width:22px;height:22px;stroke-width:3}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.goal{margin-bottom:14px}
.goal .gl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.bar{height:10px;border-radius:999px;background:var(--muted-bg);overflow:hidden}
.bar span{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .4s}
.bar.full span{background:var(--accent)}
.emp-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.swatch{width:26px;height:26px;border:1px solid var(--border);border-radius:6px;padding:0;background:none;cursor:pointer}
input[type=color].swatch{min-height:0;padding:1px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:var(--side);z-index:60;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50}
  .top .burger{display:inline-flex}
  .top{padding:12px 16px} .content{padding:16px}
  .cal .day{min-height:78px}
  .cal .chip{font-size:0;padding:0;height:6px;border-left-width:0;border-radius:3px;background:var(--c,#2563EB)}
  .cal.week{grid-template-columns:1fr}
  .cal.week .dow{display:none}
  .cal.week .day{min-height:0}
  .cal.week .chip{font-size:12.5px;height:auto;padding:3px 6px;border-left-width:3px}
  .row2{grid-template-columns:1fr}
  .seg{margin-left:0}
  .appt{grid-template-columns:56px 1fr}
  .appt>:last-child{grid-column:1/-1}
  .chat{grid-template-columns:1fr;height:calc(100vh - 120px)}
  .chat.open-pane .clist{display:none}
  .chat:not(.open-pane) .cpane{display:none}
  .chat .back{display:inline-flex}
  .hist-head{display:none}
  .hist-row{grid-template-columns:1fr 1fr}
  .hist-row .c3{grid-column:1/-1;order:3}
  .hist-row .chev{display:none}
  .banner:not(:empty){padding:10px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function toast(msg, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  $('#toasts').append(t);
  setTimeout(() => t.remove(), err ? 6000 : 3500);
}
const q = async p => { const r = await p; if (r.error) throw r.error; return r.data; };
async function run(fn, btn) {
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { console.error(e); toast(e.message || 'Ocurrió un error', true); }
  finally { if (btn) btn.disabled = false; }
}

/* ---------- modales ---------- */
function modal(title, html, {wide} = {}) {
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="mh"><h2>${esc(title)}</h2><button class="btn icon sm" type="button" data-close aria-label="Cerrar">${ic('x')}</button></div>
    <div class="mb">${html}</div></div>`;
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  ov.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', onKey);
  document.body.append(ov);
  const first = $('input:not([type=hidden]),select,textarea', ov); if (first) first.focus();
  ov.close = close;
  return ov;
}
function confirmDlg(msg, okLabel = 'Confirmar', danger = true) {
  return new Promise(res => {
    const m = modal('Confirmar', `<p>${esc(msg)}</p><div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(okLabel)}</button></div>`);
    let done = false;
    m.addEventListener('click', e => { if (e.target.closest('[data-ok]')) { done = true; m.close(); res(true); } });
    new MutationObserver(() => { if (!document.body.contains(m) && !done) { done = true; res(false); } }).observe(document.body, {childList:true});
  });
}

const safeColor = c => /^#[0-9a-f]{6}$/i.test(c || '') ? c : '';
const hashStr = t => [...String(t || '')].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);

async function loadAll() {
  const [appts, sales, refs, assigns, deliveries, notifs, team, members, msgs, reads] = await Promise.all([
    q(sb.from('appointments').select('*').order('event_date', {ascending:false})),
    q(sb.from('sales').select('*').order('created_at', {ascending:false})),
    q(sb.from('referrals').select('*').order('created_at', {ascending:false})),
    q(sb.from('gift_assignments').select('*').order('created_at', {ascending:false})),
    q(sb.from('gift_deliveries').select('*').order('created_at', {ascending:false})),
    q(sb.from('notifications').select('*').order('created_at', {ascending:false}).limit(100)),
    q(sb.from('profiles').select('*').order('created_at', {ascending:true})),
    q(sb.rpc('group_members')),
    q(sb.from('messages').select('*').order('created_at', {ascending:false}).limit(1000)),
    q(sb.from('chat_reads').select('*'))
  ]);
  Object.assign(S, {appts, sales, refs, assigns, deliveries, notifs, team, members:members || [], msgs:(msgs || []).reverse(), reads:reads || []});
  const mine = team.find(t => t.id === S.user.id);
  if (mine) S.me = mine;
  if (S.me?.role === 'admin') S.sub = await q(sb.rpc('my_subscription'));
}
async function loadNotifs() {
  const n = await q(sb.from('notifications').select('*').order('created_at', {ascending:false}).limit(100));
  const known = new Set(S.notifs.map(x => x.id));
  const fresh = n.filter(x => !known.has(x.id) && !x.read);
  S.notifs = n;
  fresh.slice(0, 3).forEach(x => toast(`${x.title}${x.body ? ': ' + x.body : ''}`));
  if (fresh.length) {
    updateBell();
    if (['notificaciones', 'equipo', 'obsequios', 'agenda'].includes(S.view) && !$('.ov') && !['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)) loadAll().then(render);
  }
}

async function boot(force) {
  const {data:{session}} = await sb.auth.getSession();
  if (!session) { S.booted = null; return renderAuth(); }
  if (S.booted === session.user.id && !force) return;
  S.booted = session.user.id; S.user = session.user;
  try {
    const me = await q(sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle());
    if (!me) { toast('Esta cuenta no tiene un perfil del dashboard. Usa una cuenta creada desde "Crear mi cuenta".', true); await sb.auth.signOut(); return; }
    S.me = me; S.sub = null;
    S.group = await q(sb.from('groups').select('*').eq('id', me.group_id).maybeSingle());
    if (me.status === 'pendiente') return renderPending();
    if (me.role === 'admin') {
      S.sub = await q(sb.rpc('my_subscription'));
      if (S.sub?.blocked) return renderBlocked();
    }
    await loadAll();

  S.assigns.filter(a => a.seller_id === sellerId).forEach(a => { const g = get(a.gift_name); if (a.status === 'aceptado') g.accepted += a.quantity; else if (a.status === 'pendiente') g.pending += a.quantity; });

    ttl.textContent = `${start.toLocaleDateString('es-CO', {day:'numeric', month:'short'})} – ${end.toLocaleDateString('es-CO', {day:'numeric', month:'short'})}`;
    let h = '';
    for (let i = 0; i < 7; i++) {
      const day = new Date(start); day.setDate(start.getDate() + i);
      h += `<div class="day ${sameDay(day, new Date()) ? 'today' : ''}" role="button" tabindex="0" data-act="calDay" data-date="${day.toISOString()}">
        <span class="small muted" style="text-transform:capitalize"><b>${day.toLocaleDateString('es-CO', {weekday:'short', day:'numeric'})}</b></span>${byDay(day).map(chip).join('') || '<span class="more">Libre</span>'}</div>`;
    }
    body.innerHTML = `<div class="cal week">${h}</div>`;
  } else if (mode === 'dia') {
    ttl.textContent = d.toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long'});
    const items = byDay(d);
    body.innerHTML = items.length ? `<div class="dayview">${items.map(apptCard).join('')}</div>` : '<div class="card empty">No hay citas este día.</div>';
  } else {
    ttl.textContent = `${list.length} cita(s)`;
    body.innerHTML = list.length ? `<div class="tw"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Dirección</th><th>Tipo</th>${isMgr() ? '<th>Emprendedor</th><th>Creada por</th>' : ''}<th>Estado</th></tr></thead><tbody>
      ${list.map(a => `<tr class="click" data-act="openAppt" data-id="${a.id}"><td>${fDT(a.event_date)}</td><td><b>${esc(a.client_name)}</b><div class="small muted">${esc(a.phone || '')}</div></td><td>${esc(a.address || '—')}</td><td>${TYPES[a.type]}</td>
      ${isMgr() ? `<td><span style="display:inline-flex;gap:6px;align-items:center"><i class="dot" style="--c:${colorOf(a.seller_id)}"></i>${esc(person(a.seller_id))}</span></td><td>${esc(person(a.created_by))}</td>` : ''}<td><span class="pill ${STATUS_PILL[a.status]}">${STATUS[a.status]}</span>${a.completed_at ? ' <span class="pill green">✓</span>' : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card empty">No hay citas con esos filtros.</div>';
  }
}

const calShift = dir => {

const HIST = {
  citas:{title:'Historial de citas', col:'Cliente', noun:'cita', ref:'appointment'},
  ventas:{title:'Historial de ventas', col:'Cliente', noun:'venta', ref:'sale'},
  referidos:{title:'Historial de referidos', col:'Referido', noun:'referido', ref:'referral'},
  obsequios:{title:'Historial de obsequios', col:'Entregado a', noun:'entrega de obsequio', ref:'delivery'}
};
function histItems(kind) {
  const from = periodStart(S.period), to = periodEnd(S.period);
  const inP = d => { const x = new Date(d); return x >= from && x < to; };
  const byDate = (a, b) => new Date(b.date) - new Date(a.date);
  let l = [];
  if (kind === 'citas') l = S.appts.filter(a => inP(a.event_date)).map(a => ({id:a.id, seller:a.seller_id, date:a.event_date, name:a.client_name, sub:TYPES[a.type]}));
  if (kind === 'ventas') l = S.sales.filter(s => inP(s.created_at)).map(s => ({id:s.id, seller:s.seller_id, date:s.created_at, name:apptOf(s.appointment_id)?.client_name || '—', sub:money(s.amount)}));
  if (kind === 'referidos') l = S.refs.filter(r => inP(r.created_at)).map(r => ({id:r.id, seller:r.seller_id, date:r.created_at, name:r.name, sub:'de ' + (apptOf(r.appointment_id)?.client_name || '—')}));
  if (kind === 'obsequios') l = S.deliveries.filter(d => inP(d.delivered_at || d.created_at)).map(d => ({id:d.id, seller:d.seller_id, date:d.delivered_at ? d.delivered_at + 'T12:00:00' : d.created_at, name:d.recipient_name, sub:`${d.quantity} × ${d.gift_name}`}));
  return l.sort(byDate);
}

}

/* =====================================================================
   Chats (estilo WhatsApp): uno a uno y chat general del grupo
   ===================================================================== */
const convKey = m => m.recipient_id == null ? 'group' : (m.sender_id === S.me.id ? m.recipient_id : (m.sender_id || 'x'));
const lastRead = key => { const r = S.reads.find(x => x.user_id === S.me.id && x.chat_key === key); return r ? new Date(r.last_read_at).getTime() : 0; };
const unreadFor = key => S.msgs.filter(m => convKey(m) === key && m.sender_id !== S.me.id && new Date(m.created_at).getTime() > lastRead(key)).length;
const unreadChats = () => { let n = 0; ['group', ...S.members.map(m => m.id)].forEach(k => { n += unreadFor(k); }); return n; };
const peerRead = m => { const r = S.reads.find(x => x.user_id === m.recipient_id && x.chat_key === S.me.id); return !!r && new Date(r.last_read_at).getTime() >= new Date(m.created_at).getTime(); };
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const chatTime = d => { const x = new Date(d), now = new Date(), y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  return sameDay(x, now) ? fTime(x) : sameDay(x, y) ? 'Ayer' : x.toLocaleDateString('es-CO', {day:'2-digit', month:'2-digit'}); };
const dayLabel = d => { const x = new Date(d), now = new Date(), y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  return sameDay(x, now) ? 'Hoy' : sameDay(x, y) ? 'Ayer' : x.toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long'}); };

function convs() {
  const list = [{key:'group', name:`Grupo · ${S.group?.name || ''}`, grp:true, url:S.group?.photo_url}];
  S.members.filter(m => m.id !== S.me.id).forEach(m => list.push({key:m.id, name:m.full_name, role:m.role, url:m.avatar_url}));
  list.forEach(c => { const ms = S.msgs.filter(m => convKey(m) === c.key); c.last = ms[ms.length - 1]; c.unread = unreadFor(c.key); });
  const t = c => c.last ? new Date(c.last.created_at).getTime() : 0;
  return list.sort((a, b) => (t(b) - t(a)) || a.name.localeCompare(b.name));
}

function chatPane() {

function refCard(m) {
  if (!m.ref_type) return '';
  let t = 'Elemento no disponible', ico = 'calendar';
  if (m.ref_type === 'appointment') { const a = apptOf(m.ref_id); if (a) t = `Cita · ${a.client_name} · ${fDate(a.event_date)}`; }
  else if (m.ref_type === 'sale') { const v = S.sales.find(x => x.id === m.ref_id); if (v) { ico = 'dollar'; t = `Venta · ${apptOf(v.appointment_id)?.client_name || 'cliente'} · ${money(v.amount)}`; } }
  else if (m.ref_type === 'referral') { const r = S.refs.find(x => x.id === m.ref_id); if (r) { ico = 'share'; t = `Referido · ${r.name}`; } }
  else if (m.ref_type === 'delivery') { const d = S.deliveries.find(x => x.id === m.ref_id); if (d) { ico = 'gift'; t = `Obsequio · ${d.quantity} × ${d.gift_name} · ${d.recipient_name}`; } }
  return `<button type="button" class="refc" data-act="openRef" data-t="${esc(m.ref_type)}" data-id="${esc(m.ref_id)}"><span class="small" style="color:var(--primary-dark);font-weight:600;display:flex;gap:6px;align-items:center">${ic(ico)}${esc(t)}</span></button>`;
}
function chatMsgs(force) {
  const box = $('#cmsgs'); if (!box) return;
  const key = S.chat.peer, grp = key === 'group';
  const st = box.scrollTop, atBottom = force || box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  let lastDay = '', h = '';
  S.msgs.filter(m => convKey(m) === key).forEach(m => {
    const day = new Date(m.created_at).toDateString();
    if (day !== lastDay) { lastDay = day; h += `<div class="day-sep">${esc(dayLabel(m.created_at))}</div>`; }
    const mine = m.sender_id === S.me.id, rd = mine && !grp && peerRead(m);
    h += `<div class="bub ${mine ? 'me' : ''}">${grp && !mine ? `<div class="who">${esc(person(m.sender_id))}</div>` : ''}${refCard(m)}${esc(m.body)}<div class="tm">${fTime(m.created_at)}${mine && !grp ? `<span class="tick ${rd ? 'read' : ''}" aria-label="${rd ? 'Leído' : 'Enviado'}">${rd ? '✓✓' : '✓'}</span>` : ''}</div></div>`;
  });
  box.innerHTML = h || '<div class="cempty">Aún no hay mensajes. Escribe el primero.</div>';
  box.scrollTop = atBottom ? box.scrollHeight : st;
  markRead(key);
  chatList();
}
async function markRead(key) {
  const ms = S.msgs.filter(m => convKey(m) === key);
  if (!ms.length || S.view !== 'chat' || S.chat.peer !== key) return;
  const last = ms[ms.length - 1].created_at;
  if (lastRead(key) >= new Date(last).getTime()) return;
  const row = {user_id:S.me.id, chat_key:key, last_read_at:last};
  const i = S.reads.findIndex(x => x.user_id === S.me.id && x.chat_key === key);
  if (i >= 0) S.reads[i] = row; else S.reads.push(row);
  updateBell();
  try { await q(sb.from('chat_reads').upsert(row, {onConflict:'user_id,chat_key'})); } catch (e) { console.warn(e); }
}
async function sendMsg() {
  const ta = $('#ctext'), body = ta.value.trim(), key = S.chat.peer;
  if (!body || !key) return;
  ta.value = ''; ta.style.height = 'auto';
  try {
    const m = await q(sb.from('messages').insert({group_id:S.me.group_id, sender_id:S.me.id, recipient_id:key === 'group' ? null : key, body}).select().single());
    onNewMsg(m); chatMsgs(true);
  } catch (e) { ta.value = body; toast(e.message || 'No se pudo enviar', true); }
}
function onNewMsg(m) {
  if (!S.me || S.msgs.some(x => x.id === m.id)) return;
  S.msgs.push(m);
  const key = convKey(m), mine = m.sender_id === S.me.id, open = S.view === 'chat' && S.chat.peer === key;
  if (S.view === 'chat') { if ($('#cmsgs')) chatMsgs(mine); else chatList(); }
  if (!mine && !open) toast(`Mensaje de ${person(m.sender_id)}: ${m.body.slice(0, 60)}`);
  updateBell();
}
async function refreshMsgs() {
  const last = S.msgs.length ? S.msgs[S.msgs.length - 1].created_at : null;
  let qy = sb.from('messages').select('*').order('created_at', {ascending:true}).limit(200);
  if (last) qy = qy.gt('created_at', last);
  const before = JSON.stringify(S.reads);
  const [fresh, reads] = await Promise.all([q(qy), q(sb.from('chat_reads').select('*'))]);
  S.reads = reads;
  fresh.forEach(onNewMsg);
  if (!fresh.length && JSON.stringify(S.reads) !== before && S.view === 'chat') chatMsgs();
}
function openChat(peer) { S.chat.peer = peer; S.chat.rendered = null; go('chat'); }

async function squareJpeg(file, size = 320) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo leer la imagen. Prueba con JPG o PNG.')); i.src = url; });
    const side = Math.min(img.width, img.height), c = document.createElement('canvas'), x = c.getContext('2d');
    c.width = c.height = size; x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
    x.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('No se pudo procesar la imagen.')), 'image/jpeg', 0.85));
  } finally { URL.revokeObjectURL(url); }
}
async function uploadAvatar(file) {
  const blob = await squareJpeg(file);
  const path = `${S.me.id}/${Date.now()}.jpg`;
  const {error} = await sb.storage.from('avatars').upload(path, blob, {contentType:'image/jpeg', cacheControl:'31536000'});
  if (error) throw new Error(/bucket|not found/i.test(error.message) ? 'Falta ejecutar schema.sql en Supabase (bucket de fotos).' : error.message);
  return sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
}
async function setPhoto(file) {
  if (!file) return;
  if (file.size > 12 * 1024 * 1024) throw new Error('La imagen pesa demasiado (máximo 12 MB).');
  const url = await uploadAvatar(file);
  if (isAdmin()) {
    await q(sb.from('profiles').update({avatar_url:url}).eq('id', S.me.id));
    await q(sb.from('groups').update({photo_url:url}).eq('id', S.me.group_id));
    S.group = {...S.group, photo_url:url};
    toast('Foto actualizada. Tu equipo verá esta imagen como la del grupo.');
  } else {
    await q(sb.from('profiles').update({pending_avatar_url:url}).eq('id', S.me.id));
    toast('Foto enviada. Tu administrador debe aprobarla.');
  }
  await loadAll(); renderShell(); render();
}
ACT.cancelPhoto = () => run(async () => { await q(sb.from('profiles').update({pending_avatar_url:null}).eq('id', S.me.id)); await loadAll(); render(); });
ACT.photoOk = d => run(async () => {
  const p = S.team.find(t => t.id === d.id);
  await q(sb.from('profiles').update({avatar_url:p.pending_avatar_url, pending_avatar_url:null}).eq('id', d.id));
  toast('Foto aprobada'); await loadAll(); render();
});
ACT.photoNo = d => run(async () => { await q(sb.from('profiles').update({pending_avatar_url:null}).eq('id', d.id)); toast('Foto rechazada'); await loadAll(); render(); });

/* =====================================================================
   Metas personales y detalle de cada emprendedor (vista del admin)
   ===================================================================== */
function periodRanges(now = new Date()) {
  const wk0 = startOfWeek(now), wk1 = new Date(wk0); wk1.setDate(wk1.getDate() + 7);
  const y = now.getFullYear(), m = now.getMonth(), first = now.getDate() <= 15;
  return {
    week:[wk0, wk1, 'Semanal', `${wk0.toLocaleDateString('es-CO', {day:'numeric', month:'short'})} – ${new Date(wk1 - 864e5).toLocaleDateString('es-CO', {day:'numeric', month:'short'})}`],
    biweek:[new Date(y, m, first ? 1 : 16), first ? new Date(y, m, 16) : new Date(y, m + 1, 1), 'Quincenal', first ? '1 al 15' : `16 al ${new Date(y, m + 1, 0).getDate()}`],
    month:[new Date(y, m, 1), new Date(y, m + 1, 1), 'Mensual', now.toLocaleDateString('es-CO', {month:'long'})]
  };
}
function goalProgress(p) {
  const r = periodRanges();
  return [['week', 'goal_week'], ['biweek', 'goal_biweek'], ['month', 'goal_month']].map(([k, col]) => {
    const [a, b, label, range] = r[k], goal = Number(p[col]) || 0;
    const sold = sum(S.sales.filter(s => s.seller_id === p.id && new Date(s.created_at) >= a && new Date(s.created_at) < b), s => s.amount);
    return {label, range, goal, sold, pct:goal ? Math.min(100, Math.round(sold / goal * 100)) : 0, over:goal ? Math.round(sold / goal * 100) : 0};
  });
}
const goalBars = p => goalProgress(p).map(g => `<div class="goal"><div class="gl"><span><b>${g.label}</b> <span class="small muted">· ${esc(g.range)}</span></span>
  <span class="small ${g.goal ? '' : 'muted'}">${g.goal ? `${money(g.sold)} de ${money(g.goal)} · <b>${g.over}%</b>${g.over >= 100 ? ' ¡Meta cumplida!' : ''}` : 'Sin meta definida'}</span></div>
  <div class="bar ${g.goal && g.sold >= g.goal ? 'full' : ''}" role="progressbar" aria-label="Meta ${g.label.toLowerCase()}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${g.pct}"><span style="width:${g.pct}%"></span></div></div>`).join('');

ACT.empOpen = d => empDetail(d.id, 'ventas');
ACT.empTab = d => empDetail(d.id, d.tab);
ACT.rowDetail = d => histDetail(d.k, d.id, false);
function empDetail(id, tab) {
  const p = S.team.find(t => t.id === id); if (!p) return;
  $$('.ov').forEach(o => o.close?.());
  const sales = S.sales.filter(x => x.seller_id === id), appts = S.appts.filter(a => a.seller_id === id);
  const refs = S.refs.filter(r => r.seller_id === id), dels = S.deliveries.filter(x => x.seller_id === id);
  const tabs = [['ventas', 'Ventas', sales.length], ['agendas', 'Agendas', appts.length], ['referidos', 'Referidos', refs.length], ['obsequios', 'Obsequios', dels.length]];
  const tbl = (head, rows) => rows.length ? `<div class="tw"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : '<div class="empty">Sin registros.</div>';
  let body = '';
  if (tab === 'ventas') body = tbl(['Fecha', 'Cliente', 'Valor', 'Comisión'], sales.map(x => `<tr class="click" data-act="rowDetail" data-k="ventas" data-id="${x.id}"><td>${fDate(x.created_at)}</td><td>${esc(apptOf(x.appointment_id)?.client_name || '—')}</td><td>${money(x.amount)}</td><td>${money(x.commission_amount)}</td></tr>`));
  if (tab === 'agendas') body = tbl(['Fecha', 'Cliente', 'Tipo', 'Estado'], appts.map(a => `<tr class="click" data-act="openAppt" data-id="${a.id}"><td>${fDT(a.event_date)}</td><td>${esc(a.client_name)}</td><td>${TYPES[a.type]}</td><td><span class="pill ${STATUS_PILL[a.status]}">${STATUS[a.status]}</span>${a.completed_at ? ' <span class="pill green">✓ Completada</span>' : ''}</td></tr>`));
  if (tab === 'referidos') body = tbl(['Fecha', 'Referido', 'Teléfono', 'De (cliente)'], refs.map(r => `<tr class="click" data-act="rowDetail" data-k="referidos" data-id="${r.id}"><td>${fDate(r.created_at)}</td><td>${esc(r.name)}</td><td>${esc(r.phone || '—')}</td><td>${esc(apptOf(r.appointment_id)?.client_name || '—')}</td></tr>`));
  if (tab === 'obsequios') body = tbl(['Entrega', 'Obsequio', 'Entregado a', 'Motivo'], byDelivery(dels).map(x => `<tr class="click" data-act="rowDetail" data-k="obsequios" data-id="${x.id}"><td>${fDay(x.delivered_at || x.created_at)}</td><td>${x.quantity} × ${esc(x.gift_name)}</td><td>${esc(x.recipient_name)}</td><td>${esc(x.reason)}</td></tr>`));
  const kp = (l, v) => `<div class="card kpi" style="padding:12px"><div class="l">${l}</div><div class="v" style="font-size:18px">${v}</div></div>`;
  modal(`Información de ${p.full_name}`, `
    <div class="emp-head">${avatar(p.full_name, p.avatar_url, 'lg')}<div style="flex:1;min-width:200px"><b style="font-size:17px">${esc(p.full_name)}</b>
      <div><span class="pill blue">${ROLES[p.role]}</span>${p.role !== 'admin' ? ` <span class="small muted" style="display:inline-flex;gap:6px;align-items:center"><i class="dot" style="--c:${colorOf(p.id)}"></i>color en la agenda · comisión ${p.commission_pct}%</span>` : ''}</div>
      <div class="small muted">${esc(p.email || '')}${p.phone ? ' · ' + esc(p.phone) : ''}</div></div>
      ${p.id !== S.me.id ? `<button class="btn sm" data-act="empChat" data-id="${p.id}">${ic('chat')} Chat</button>` : ''}</div>
    <div class="grid kpis" style="margin-bottom:12px">${kp('Citas', appts.length)}${kp('Completadas', appts.filter(a => a.completed_at).length)}${kp('Ventas', sales.length)}${kp('Total vendido', money(sum(sales, x => x.amount)))}${kp('Comisión', money(sum(sales, x => x.commission_amount)))}</div>
    ${p.role !== 'admin' ? `<div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:10px">Metas de ventas</h3>${goalBars(p)}</div>` : ''}
    <div class="seg" style="margin:0 0 12px" role="group" aria-label="Listados">${tabs.map(([k, l, n]) => `<button data-act="empTab" data-id="${id}" data-tab="${k}" class="${tab === k ? 'on' : ''}">${l} (${n})</button>`).join('')}</div>
    ${body}`, {wide:true});
}
ACT.empChat = d => { $$('.ov').forEach(o => o.close?.()); openChat(d.id); };
