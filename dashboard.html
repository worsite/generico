<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Ventas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563EB; --primary-dark:#1D4ED8; --primary-soft:#EAF1FE;
  --accent:#059669; --accent-soft:#E3F6EE; --warn:#B45309; --warn-soft:#FEF3C7;
  --danger:#DC2626; --danger-soft:#FDE8E8;
  --bg:#F8FAFC; --card:#FFFFFF; --fg:#0F172A; --muted:#475569; --muted-bg:#F1F5F9; --border:#DDE5F0;
  --radius:10px; --side:244px;
  --font:'Fira Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Fira Code',ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono)}
.right{text-align:right}

/* botones */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-weight:500;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--muted-bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.green{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.green:hover{background:#047857}
.btn.danger{color:var(--danger);border-color:#F5C2C2}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn.icon{width:40px;padding:0;justify-content:center}
.btn.sm.icon{width:34px}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* formularios */
label.f{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:12px}
label.f>span{display:block;margin-bottom:4px}
input,select,textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.err{background:var(--danger-soft);color:#991B1B;border-radius:8px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:18px}
.brand .logo{width:36px;height:36px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center}
.tabs{display:flex;background:var(--muted-bg);border-radius:9px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;border-radius:6px;min-height:36px;font-weight:500;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--fg);box-shadow:0 0 0 1px var(--border)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.role{border:1.5px solid var(--border);border-radius:10px;padding:12px;text-align:left;background:#fff}
.role.on{border-color:var(--primary);background:var(--primary-soft)}
.role b{display:block} .role span{font-size:12.5px;color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border:0;background:transparent;border-radius:8px;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--muted-bg);color:var(--fg)}
.nav button.on{background:var(--primary-soft);color:var(--primary-dark)}
.nav .badge{margin-left:auto}
.badge{background:var(--danger);color:#fff;border-radius:999px;font-size:11.5px;font-weight:600;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center}
.side .me{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top .grow{flex:1;min-width:0}
.top .burger{display:none}
.content{padding:24px;max-width:1400px}
.pagehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--muted-bg);color:var(--muted)}
.pill.blue{background:var(--primary-soft);color:var(--primary-dark)}
.pill.green{background:var(--accent-soft);color:#047857}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.red{background:var(--danger-soft);color:#B91C1C}

/* tarjetas */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card>h2{margin-bottom:12px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(176px,1fr));margin-bottom:16px}
.kpi{padding:16px}
.kpi .l{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--mono);font-weight:600;font-size:22px;margin-top:6px;overflow-wrap:anywhere}
.kpi.g .v{color:#047857} .kpi.b .v{color:var(--primary-dark)}
.cols2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.chartbox{position:relative;height:250px}

/* tablas */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--muted-bg);text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:#F8FAFF}
td.num,th.num{text-align:right;font-family:var(--mono)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar>*{width:auto}
.toolbar select,.toolbar input{min-width:150px}
.toolbar .grow{flex:1;min-width:180px}

/* calendario */
.calhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.calhead .ttl{font-weight:600;font-size:16px;min-width:160px}
.calhead .ttl::first-letter{text-transform:uppercase}
.seg{display:inline-flex;background:var(--muted-bg);border-radius:8px;padding:3px;margin-left:auto}
.seg button{border:0;background:transparent;border-radius:6px;min-height:32px;padding:0 12px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--fg);box-shadow:0 0 0 1px var(--border)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff}
.cal .dow{background:var(--muted-bg);padding:8px;font-size:12.5px;font-weight:600;color:var(--muted);text-align:center}
.cal .day{min-height:108px;border-top:1px solid var(--border);border-left:1px solid var(--border);padding:4px;display:flex;flex-direction:column;gap:3px;background:#fff;text-align:left;cursor:pointer}
.cal .day:nth-child(7n+8){border-left:0}
.cal .day.out{background:#FAFBFD;color:#94A3B8}
.cal .day .n{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal .day.today .n{background:var(--primary);color:#fff}
.cal.week .day{min-height:260px}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:5px;padding:2px 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--primary-soft);color:var(--primary-dark);border-left:3px solid var(--primary)}
.chip.venta{background:var(--accent-soft);color:#065F46;border-color:var(--accent)}
.chip.sin_venta{background:var(--muted-bg);color:var(--muted);border-color:#94A3B8}
.chip.cancelada{background:var(--danger-soft);color:#991B1B;border-color:var(--danger);text-decoration:line-through}
.more{font-size:12px;color:var(--muted);padding:0 4px}
.dayview{display:grid;gap:10px}
.appt{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:var(--radius);background:#fff;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.appt.venta{border-left-color:var(--accent)} .appt.sin_venta{border-left-color:#94A3B8} .appt.cancelada{border-left-color:var(--danger);opacity:.75}
.appt .t{font-family:var(--mono);font-weight:600}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:16px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;padding:22px}
.modal.wide{max-width:680px}
.modal .mh{display:flex;align-items:center;margin-bottom:14px}
.modal .mh h2{flex:1}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px;margin-bottom:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:200}
.toast{background:var(--fg);color:#fff;padding:11px 16px;border-radius:9px;font-size:14px;max-width:340px}
.toast.err{background:#B91C1C}
.notif{display:flex;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;width:100%;text-align:left}
.notif.unread{border-left:4px solid var(--primary);background:#F8FAFF}
.notif+.notif{margin-top:8px}
.code{font-family:var(--mono);font-weight:600;letter-spacing:.06em;background:var(--primary-soft);color:var(--primary-dark);padding:4px 10px;border-radius:7px}
.scrim{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:var(--side);z-index:60;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50}
  .top .burger{display:inline-flex}
  .top{padding:12px 16px} .content{padding:16px}
  .cal .day{min-height:78px}
  .cal .chip{font-size:0;padding:0;height:6px;border-left-width:0;border-radius:3px}
  .cal.week{grid-template-columns:1fr}
  .cal.week .dow{display:none}
  .cal.week .day{min-height:0}
  .cal.week .chip{font-size:12.5px;height:auto;padding:3px 6px;border-left-width:3px}
  .row2{grid-template-columns:1fr}
  .seg{margin-left:0}
  .appt{grid-template-columns:56px 1fr}
  .appt>:last-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"><div class="auth"><div class="muted">Cargando…</div></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
'use strict';
/* =====================================================================
   Configuracion de Supabase (la anon key es publica; la seguridad real
   esta en las politicas RLS definidas en schema.sql)
   ===================================================================== */
const SUPABASE_URL = 'https://qpsctrxhbhlbfmjopoti.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwc2N0cnhoYmhsYmZtam9wb3RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTg4ODUsImV4cCI6MjEwODI5NDg4NX0.VXrePNtCRS6npBmg4aXsiJ-IY1fImYuGGncUVoOWfYE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop = new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0});
const money = n => cop.format(Number(n) || 0);
const sum = (a, f) => a.reduce((t, x) => t + (Number(f(x)) || 0), 0);
const fDate = d => new Date(d).toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'});
const fTime = d => new Date(d).toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'});
const fDT = d => `${fDate(d)} · ${fTime(d)}`;
const toInput = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 16); };
const TYPES = {mantenimiento:'Mantenimiento', demo:'Demo', servicio_adicional:'Servicio adicional'};
const STATUS = {pendiente:'Pendiente', venta:'Venta', sin_venta:'Sin venta', cancelada:'Cancelada'};
const STATUS_PILL = {pendiente:'blue', venta:'green', sin_venta:'', cancelada:'red'};
const ROLES = {admin:'Administrador', agendador:'Agendador', vendedor:'Vendedor'};

const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  dollar:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v9H5v-9M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>', left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',
  edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>', check:'<path d="M20 6 9 17l-5-5"/>',
  chart:'<path d="M3 3v18h18M7 14l4-4 4 4 5-6"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

function toast(msg, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  $('#toasts').append(t);
  setTimeout(() => t.remove(), err ? 6000 : 3500);
}
const q = async p => { const r = await p; if (r.error) throw r.error; return r.data; };
async function run(fn, btn) {
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { console.error(e); toast(e.message || 'Ocurrió un error', true); }
  finally { if (btn) btn.disabled = false; }
}

/* ---------- modales ---------- */
function modal(title, html, {wide} = {}) {
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="mh"><h2>${esc(title)}</h2><button class="btn icon sm" type="button" data-close aria-label="Cerrar">${ic('x')}</button></div>
    <div class="mb">${html}</div></div>`;
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  ov.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', onKey);
  document.body.append(ov);
  const first = $('input:not([type=hidden]),select,textarea', ov); if (first) first.focus();
  ov.close = close;
  return ov;
}
function confirmDlg(msg, okLabel = 'Confirmar', danger = true) {
  return new Promise(res => {
    const m = modal('Confirmar', `<p>${esc(msg)}</p><div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(okLabel)}</button></div>`);
    let done = false;
    m.addEventListener('click', e => { if (e.target.closest('[data-ok]')) { done = true; m.close(); res(true); } });
    new MutationObserver(() => { if (!document.body.contains(m) && !done) { done = true; res(false); } }).observe(document.body, {childList:true});
  });
}

/* =====================================================================
   Estado
   ===================================================================== */
const S = {
  user:null, me:null, group:null, view:'resumen',
  appts:[], sales:[], refs:[], assigns:[], deliveries:[], notifs:[], team:[],
  cal:{mode:'mes', date:new Date()},
  f:{seller:'', type:'', status:'', q:''},
  period:'mes', sellerFilterSales:'', booted:null, poll:null
};
const isAdmin = () => S.me?.role === 'admin';
const isMgr = () => ['admin', 'agendador'].includes(S.me?.role);
const person = id => id === S.me?.id ? 'Tú' : (S.team.find(t => t.id === id)?.full_name || (id ? 'Otro usuario' : 'Usuario eliminado'));
const sellers = () => S.team.filter(t => t.status === 'activo');
const apptOf = id => S.appts.find(a => a.id === id);
const saleOf = apptId => S.sales.find(s => s.appointment_id === apptId);
const unread = () => S.notifs.filter(n => !n.read).length;

async function loadAll() {
  const [appts, sales, refs, assigns, deliveries, notifs, team] = await Promise.all([
    q(sb.from('appointments').select('*').order('event_date', {ascending:false})),
    q(sb.from('sales').select('*').order('created_at', {ascending:false})),
    q(sb.from('referrals').select('*').order('created_at', {ascending:false})),
    q(sb.from('gift_assignments').select('*').order('created_at', {ascending:false})),
    q(sb.from('gift_deliveries').select('*').order('created_at', {ascending:false})),
    q(sb.from('notifications').select('*').order('created_at', {ascending:false}).limit(100)),
    q(sb.from('profiles').select('*').order('created_at', {ascending:true}))
  ]);
  Object.assign(S, {appts, sales, refs, assigns, deliveries, notifs, team});
  const mine = team.find(t => t.id === S.user.id);
  if (mine) S.me = mine;
}
async function loadNotifs() {

async function boot(force) {
  const {data:{session}} = await sb.auth.getSession();
  if (!session) { S.booted = null; return renderAuth(); }
  if (S.booted === session.user.id && !force) return;
  S.booted = session.user.id; S.user = session.user;
  try {
    const me = await q(sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle());
    if (!me) { toast('Tu perfil no existe. Ejecuta schema.sql en Supabase.', true); return renderAuth(); }
    S.me = me;
    S.group = await q(sb.from('groups').select('*').eq('id', me.group_id).maybeSingle());
    if (me.status === 'pendiente') return renderPending();
    await loadAll();
    S.group = S.group || await q(sb.from('groups').select('*').eq('id', me.group_id).maybeSingle());
    S.view = 'resumen';
    renderShell(); render(); startPoll();
  } catch (e) { console.error(e); toast(e.message, true); renderAuth(); }
}
function startPoll() { stopPoll(); S.poll = setInterval(() => run(loadNotifs), 20000); }
function stopPoll() { clearInterval(S.poll); S.poll = null; }

sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'SIGNED_OUT') { S.booted = null; renderAuth(); }
  else if (session && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) setTimeout(() => boot(), 0);
  else if (ev === 'INITIAL_SESSION' && !session) renderAuth();
});

function monthsBack(n) {
  const out = [], now = new Date();
  for (let i = n - 1; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); out.push({key:`${d.getFullYear()}-${d.getMonth()}`, label:d.toLocaleDateString('es-CO', {month:'short'})}); }
  return out;
}
const mkey = d => { const x = new Date(d); return `${x.getFullYear()}-${x.getMonth()}`; };
function periodEnd(p) {
  const n = new Date();
  if (p === 'mes') return new Date(n.getFullYear(), n.getMonth() + 1, 1);
  if (p === 'anio') return new Date(n.getFullYear() + 1, 0, 1);
  return new Date(8.64e15);
}
function periodStart(p) {
  const n = new Date();
  if (p === 'mes') return new Date(n.getFullYear(), n.getMonth(), 1);
  if (p === '3m') return new Date(n.getFullYear(), n.getMonth() - 2, 1);
  if (p === 'anio') return new Date(n.getFullYear(), 0, 1);
  return new Date(0);
}

  const ttl = $('#calTtl');
  const byDay = day => list.filter(a => sameDay(a.event_date, day)).sort((x, y) => new Date(x.event_date) - new Date(y.event_date));
  const chip = a => `<span class="chip ${a.status}" role="button" tabindex="0" data-act="openAppt" data-id="${a.id}" title="${esc(a.client_name)}">${fTime(a.event_date)} ${esc(a.client_name)}</span>`;
  if (mode === 'mes') {
    ttl.textContent = d.toLocaleDateString('es-CO', {month:'long', year:'numeric'});
    const start = startOfWeek(new Date(d.getFullYear(), d.getMonth(), 1));
    let h = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(x => `<div class="dow">${x}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const day = new Date(start); day.setDate(start.getDate() + i);
      const items = byDay(day);
      h += `<div class="day ${day.getMonth() !== d.getMonth() ? 'out' : ''} ${sameDay(day, new Date()) ? 'today' : ''}" role="button" tabindex="0" data-act="calDay" data-date="${day.toISOString()}">
        <span class="n">${day.getDate()}</span>${items.slice(0, 3).map(chip).join('')}${items.length > 3 ? `<span class="more">+${items.length - 3} más</span>` : ''}</div>`;
    }
    body.innerHTML = `<div class="cal">${h}</div>`;
  } else if (mode === 'semana') {
    const start = startOfWeek(d), end = new Date(start); end.setDate(end.getDate() + 6);
    ttl.textContent = `${start.toLocaleDateString('es-CO', {day:'numeric', month:'short'})} – ${end.toLocaleDateString('es-CO', {day:'numeric', month:'short'})}`;
    let h = '';
    for (let i = 0; i < 7; i++) {
      const day = new Date(start); day.setDate(start.getDate() + i);
      h += `<div class="day ${sameDay(day, new Date()) ? 'today' : ''}" role="button" tabindex="0" data-act="calDay" data-date="${day.toISOString()}">
        <span class="small muted" style="text-transform:capitalize"><b>${day.toLocaleDateString('es-CO', {weekday:'short', day:'numeric'})}</b></span>${byDay(day).map(chip).join('') || '<span class="more">Libre</span>'}</div>`;
    }
    body.innerHTML = `<div class="cal week">${h}</div>`;
  } else if (mode === 'dia') {
    ttl.textContent = d.toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long'});
    const items = byDay(d);
    body.innerHTML = items.length ? `<div class="dayview">${items.map(apptCard).join('')}</div>` : '<div class="card empty">No hay citas este día.</div>';
  } else {
    ttl.textContent = `${list.length} cita(s)`;
    body.innerHTML = list.length ? `<div class="tw"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Dirección</th><th>Tipo</th>${isMgr() ? '<th>Vendedor</th><th>Creada por</th>' : ''}<th>Estado</th></tr></thead><tbody>
      ${list.map(a => `<tr class="click" data-act="openAppt" data-id="${a.id}"><td>${fDT(a.event_date)}</td><td><b>${esc(a.client_name)}</b><div class="small muted">${esc(a.phone || '')}</div></td><td>${esc(a.address || '—')}</td><td>${TYPES[a.type]}</td>
      ${isMgr() ? `<td>${esc(person(a.seller_id))}</td><td>${esc(person(a.created_by))}</td>` : ''}<td><span class="pill ${STATUS_PILL[a.status]}">${STATUS[a.status]}</span></td></tr>`).join('')}</tbody></table></div>` : '<div class="card empty">No hay citas con esos filtros.</div>';
  }
}
ACT.calMode = (d) => { S.cal.mode = d.m; agBody(); };
ACT.calToday = () => { S.cal.date = new Date(); agBody(); };
const calShift = dir => {
  const d = new Date(S.cal.date), m = S.cal.mode;
  if (m === 'mes') d.setMonth(d.getMonth() + dir, 1); else d.setDate(d.getDate() + dir * (m === 'semana' ? 7 : 1));
  S.cal.date = d; agBody();
};
ACT.calPrev = () => calShift(-1); ACT.calNext = () => calShift(1);
ACT.calDay = (d, b, e) => { if (e.target.closest('[data-id]')) return; S.cal.date = new Date(d.date); S.cal.mode = 'dia'; agBody(); };

    <label class="f"><span>Cantidad *</span><input name="quantity" type="number" min="1" max="${g.available}" value="1" required></label>
    <label class="f"><span>¿Por qué se lo entregaste? *</span><textarea name="reason" required></textarea></label>
    <div class="mf"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">Registrar</button></div></form>`);
  $('#fD', m).onsubmit = e => {
    e.preventDefault(); const f = new FormData(e.target);
    run(async () => {
      await q(sb.from('gift_deliveries').insert({group_id:S.me.group_id, seller_id:S.me.id, quantity:Number(f.get('quantity')), recipient_name:f.get('recipient_name').trim(), recipient_contact:f.get('recipient_contact').trim() || null, reason:f.get('reason').trim()}));
      m.close(); toast('Entrega registrada'); await loadAll(); render();
    }, $('button[type=submit]', m));
  };
};
function giftsManager(el) {
  const rows = S.team.filter(p => p.status === 'activo');
  el.innerHTML = `<div class="pagehead"><div class="grow"><div class="small muted">Inventario de obsequios por vendedor</div></div>
    ${isAdmin() ? `<button class="btn primary" data-act="newAssign">${ic('gift')} Enviar obsequios</button>` : ''}</div>
    <div class="tw"><table><thead><tr><th>Vendedor</th><th class="num">Aceptados</th><th class="num">Pendientes</th><th class="num">Entregados</th><th class="num">Disponibles</th></tr></thead><tbody>
    ${rows.map(p => { const g = giftStats(p.id); return `<tr><td><b>${esc(p.full_name)}</b><div class="small muted">${ROLES[p.role]}</div></td><td class="num">${g.accepted}</td><td class="num">${g.pending}</td><td class="num">${g.delivered}</td><td class="num"><b>${g.available}</b></td></tr>`; }).join('')}</tbody></table></div>
    <div class="pagehead" style="margin-top:24px"><div class="grow"><h2>Entregas a clientes</h2></div></div>
    ${S.deliveries.length ? `<div class="tw"><table><thead><tr><th>Fecha</th><th>Vendedor</th><th>Entregado a</th><th>Contacto</th><th class="num">Cant.</th><th>Motivo</th></tr></thead><tbody>
    ${S.deliveries.map(d => `<tr><td>${fDate(d.created_at)}</td><td>${esc(person(d.seller_id))}</td><td><b>${esc(d.recipient_name)}</b></td><td>${esc(d.recipient_contact || '—')}</td><td class="num">${d.quantity}</td><td>${esc(d.reason)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card empty">Aún no hay entregas registradas.</div>'}`;
}
ACT.newAssign = () => {
  const m = modal('Enviar obsequios', `<form id="fG"><label class="f"><span>Vendedor *</span><select name="seller_id" required>${sellers().map(p => `<option value="${p.id}">${esc(p.full_name)}</option>`).join('')}</select></label>
    <label class="f"><span>Cantidad *</span><input name="quantity" type="number" min="1" value="10" required></label>
    <p class="hint">El vendedor recibirá una notificación y debe aceptarlos.</p>
    <div class="mf"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">Enviar</button></div></form>`);
  $('#fG', m).onsubmit = e => {
    e.preventDefault(); const f = new FormData(e.target);
    run(async () => {
      await q(sb.from('gift_assignments').insert({group_id:S.me.group_id, seller_id:f.get('seller_id'), quantity:Number(f.get('quantity')), created_by:S.me.id}));
      m.close(); toast('Obsequios enviados'); await loadAll(); render();
    }, $('button[type=submit]', m));
  };
};

/* =====================================================================
   Equipo (admin y agendador)
   ===================================================================== */
VIEWS.equipo = el => {
  const pend = S.team.filter(t => t.status === 'pendiente');
  const bajas = S.team.filter(t => t.delete_requested && t.status === 'activo');
  const act = S.team.filter(t => t.status === 'activo');
  const stat = id => ({v:S.sales.filter(s => s.seller_id === id).length, c:S.appts.filter(a => a.seller_id === id).length});
  el.innerHTML = `
    <div class="pagehead"><div class="grow">${isAdmin() ? `<div class="small muted">Comparte este código para que tus vendedores se registren: <span class="code">${esc(S.group?.code || '')}</span> <button class="btn sm icon" data-act="copyCode" aria-label="Copiar código">${ic('copy')}</button></div>` : '<div class="small muted">Puedes aceptar o rechazar solicitudes de ingreso.</div>'}</div>
      ${isAdmin() ? `<button class="btn" data-act="msgAll">${ic('send')} Mensaje a todos</button>` : ''}</div>
    ${pend.length ? `<div class="card" style="margin-bottom:16px;border-color:#FCD34D"><h2>Solicitudes de ingreso (${pend.length})</h2>
      ${pend.map(p => `<div class="actions" style="align-items:center;padding:8px 0;border-top:1px solid var(--border)"><div style="flex:1;min-width:180px"><b>${esc(p.full_name)}</b><div class="small muted">${esc(p.email || '')} ${p.phone ? '· ' + esc(p.phone) : ''}</div></div>
      <button class="btn green sm" data-act="accept" data-id="${p.id}">${ic('check')} Aceptar</button><button class="btn danger sm" data-act="reject" data-id="${p.id}">Rechazar</button></div>`).join('')}</div>` : ''}
    ${isAdmin() && bajas.length ? `<div class="card" style="margin-bottom:16px;border-color:#F5C2C2"><h2>Solicitudes para eliminar cuenta (${bajas.length})</h2>
      ${bajas.map(p => `<div class="actions" style="align-items:center;padding:8px 0;border-top:1px solid var(--border)"><div style="flex:1;min-width:180px"><b>${esc(p.full_name)}</b><div class="small muted">Pidió eliminar su cuenta</div></div>
      <button class="btn danger sm" data-act="removeUser" data-id="${p.id}" data-quiet="1">Aprobar y eliminar</button><button class="btn sm" data-act="keepUser" data-id="${p.id}">Rechazar</button></div>`).join('')}</div>` : ''}
    <div class="tw"><table><thead><tr><th>Nombre</th><th>Contacto</th><th>Cargo</th><th class="num">Comisión %</th><th class="num">Citas</th><th class="num">Ventas</th><th></th></tr></thead><tbody>
    ${act.map(p => { const s = stat(p.id), me = p.id === S.me.id; return `<tr><td><b>${esc(p.full_name)}</b>${me ? ' <span class="pill blue">Tú</span>' : ''}</td><td class="small">${esc(p.email || '')}<div class="muted">${esc(p.phone || '')}</div></td>
      <td>${isAdmin() && !me ? `<select data-role-for="${p.id}" aria-label="Cargo de ${esc(p.full_name)}" style="min-width:140px">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${p.role === k ? 'selected' : ''}>${v}</option>`).join('')}</select>` : ROLES[p.role]}</td>
      <td class="num">${isAdmin() ? `<input type="number" min="0" max="100" step="0.5" value="${p.commission_pct}" data-comm-for="${p.id}" aria-label="Comisión de ${esc(p.full_name)}" style="width:84px;text-align:right">` : p.commission_pct + '%'}</td>
      <td class="num">${s.c}</td><td class="num">${s.v}</td>
      <td><div class="actions">${me ? '' : `<button class="btn sm icon" data-act="msgOne" data-id="${p.id}" aria-label="Enviar mensaje">${ic('send')}</button>`}${isAdmin() && !me ? `<button class="btn sm icon danger" data-act="removeUser" data-id="${p.id}" aria-label="Eliminar usuario">${ic('trash')}</button>` : ''}</div></td></tr>`; }).join('')}</tbody></table></div>`;
  $$('[data-role-for]', el).forEach(s => s.onchange = () => run(async () => {
    await q(sb.from('profiles').update({role:s.value}).eq('id', s.dataset.roleFor)); toast('Cargo actualizado'); await loadAll(); render();
  }));
  $$('[data-comm-for]', el).forEach(i => i.onchange = () => run(async () => {
    const v = Math.min(100, Math.max(0, Number(i.value) || 0));
    await q(sb.from('profiles').update({commission_pct:v}).eq('id', i.dataset.commFor)); toast('Comisión actualizada (aplica a ventas nuevas)'); await loadAll(); render();
  }));
};
ACT.accept = d => run(async () => { await q(sb.from('profiles').update({status:'activo'}).eq('id', d.id)); toast('Solicitud aceptada'); await loadAll(); render(); });
ACT.reject = async d => {
  if (await confirmDlg('¿Rechazar esta solicitud? Se eliminará la cuenta solicitante.', 'Rechazar'))
    run(async () => { await q(sb.rpc('admin_remove_user', {p_user:d.id})); toast('Solicitud rechazada'); await loadAll(); render(); });
};
ACT.removeUser = async d => {
  const p = S.team.find(t => t.id === d.id);
  if (await confirmDlg(`¿Eliminar a ${p?.full_name}? Perderá el acceso. Sus citas y ventas se conservan en el historial.`, 'Eliminar usuario'))
    run(async () => { await q(sb.rpc('admin_remove_user', {p_user:d.id})); toast('Usuario eliminado'); await loadAll(); render(); });
};
ACT.keepUser = d => run(async () => { await q(sb.from('profiles').update({delete_requested:false}).eq('id', d.id)); toast('Solicitud rechazada'); await loadAll(); render(); });
ACT.msgOne = d => msgForm(d.id);
ACT.msgAll = () => msgForm(null);
function msgForm(uid) {
  const m = modal(uid ? `Mensaje para ${person(uid)}` : 'Mensaje para todo el equipo', `<form id="fM">
    <label class="f"><span>Asunto *</span><input name="title" required maxlength="80"></label>
    <label class="f"><span>Mensaje *</span><textarea name="body" required></textarea></label>
    <div class="mf"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">${ic('send')} Enviar</button></div></form>`);
  $('#fM', m).onsubmit = e => {
    e.preventDefault(); const f = new FormData(e.target);
    run(async () => {
      const to = uid ? [uid] : S.team.filter(t => t.status === 'activo' && t.id !== S.me.id).map(t => t.id);
      if (!to.length) throw new Error('No hay destinatarios.');
      await q(sb.from('notifications').insert(to.map(id => ({group_id:S.me.group_id, user_id:id, type:'mensaje', title:f.get('title').trim(), body:f.get('body').trim()}))));
      m.close(); toast(`Mensaje enviado a ${to.length} persona(s)`);
    }, $('button[type=submit]', m));
  };
}

/* =====================================================================
   Notificaciones y perfil
   ===================================================================== */
VIEWS.notificaciones = el => {
  el.innerHTML = `<div class="pagehead"><div class="grow"><div class="small muted">${unread()} sin leer</div></div>
    <button class="btn" data-act="readAll" ${unread() ? '' : 'disabled'}>${ic('check')} Marcar todas como leídas</button></div>
    ${S.notifs.length ? S.notifs.map(n => `<button class="notif ${n.read ? '' : 'unread'}" data-act="readOne" data-id="${n.id}">
      <span style="color:var(--primary)">${ic({solicitud:'users', baja:'user', obsequio:'gift', agenda:'calendar', mensaje:'send'}[n.type] || 'bell')}</span>
      <span style="flex:1"><b>${esc(n.title)}</b><div class="small">${esc(n.body || '')}</div><div class="small muted">${fDT(n.created_at)}</div></span></button>`).join('') : '<div class="card empty">No tienes notificaciones.</div>'}`;
};
ACT.readOne = d => run(async () => {
  const n = S.notifs.find(x => x.id === d.id); if (!n || n.read) return;
  await q(sb.from('notifications').update({read:true}).eq('id', d.id)); n.read = true; render();
});
ACT.readAll = () => run(async () => {
  await q(sb.from('notifications').update({read:true}).eq('user_id', S.me.id).eq('read', false)); S.notifs.forEach(n => n.read = true); render();
});
VIEWS.perfil = el => {
  const me = S.me, g = giftStats(me.id);
  const mySales = S.sales.filter(s => s.seller_id === me.id);
  el.innerHTML = `<div class="grid cols2">
    <div class="card"><h2>Mi información</h2><form id="fP">
      <label class="f"><span>Nombre completo</span><input name="full_name" required value="${esc(me.full_name)}"></label>
      <div class="row2"><label class="f"><span>Teléfono</span><input name="phone" type="tel" value="${esc(me.phone)}"></label>
      <label class="f"><span>Correo</span><input value="${esc(me.email)}" disabled></label></div>
      <button class="btn primary" type="submit">Guardar cambios</button></form></div>
    <div class="card"><h2>Mi cuenta</h2><dl class="kv">
      <dt>Cargo</dt><dd><span class="pill blue">${ROLES[me.role]}</span></dd>
      <dt>Grupo</dt><dd>${esc(S.group?.name || '—')}</dd>
      ${isAdmin() ? `<dt>Código del grupo</dt><dd><span class="code">${esc(S.group?.code || '')}</span></dd>` : `<dt>Mi comisión</dt><dd><b>${me.commission_pct}%</b> de cada venta</dd>`}
      <dt>Ventas totales</dt><dd>${mySales.length} · ${money(sum(mySales, s => s.amount))}</dd>
      <dt>Comisión acumulada</dt><dd>${money(sum(mySales, s => s.commission_amount))}</dd>
      <dt>Obsequios disponibles</dt><dd>${g.available}</dd></dl>
      ${isAdmin() ? '' : me.delete_requested ? '<div class="pill warn">Solicitud de eliminación enviada, esperando al administrador</div>'
        : '<button class="btn danger" data-act="reqDelete">Solicitar eliminar mi cuenta</button>'}</div></div>`;
  $('#fP').onsubmit = e => {
    e.preventDefault(); const f = new FormData(e.target);
    run(async () => { await q(sb.from('profiles').update({full_name:f.get('full_name').trim(), phone:f.get('phone').trim() || null}).eq('id', me.id)); toast('Perfil actualizado'); await loadAll(); renderShell(); render(); }, $('button[type=submit]', el));
  };
};
ACT.reqDelete = async () => {
  if (!await confirmDlg('Se enviará una solicitud al administrador para eliminar tu cuenta. ¿Continuar?', 'Enviar solicitud')) return;
  run(async () => { await q(sb.from('profiles').update({delete_requested:true}).eq('id', S.me.id)); toast('Solicitud enviada'); await loadAll(); render(); });
};

</script>
</body>
</html>
