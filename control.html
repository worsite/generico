<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Control de la plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563EB; --primary-dark:#1D4ED8; --primary-soft:#EAF1FE;
  --accent:#059669; --accent-soft:#E3F6EE; --warn:#B45309; --warn-soft:#FEF3C7;
  --danger:#DC2626; --danger-soft:#FDE8E8;
  --bg:#F8FAFC; --card:#FFFFFF; --fg:#0F172A; --muted:#475569; --muted-bg:#F1F5F9; --border:#DDE5F0;
  --radius:10px; --font:'Fira Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Fira Code',ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0;line-height:1.2} h1{font-size:20px} h2{font-size:17px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px} .num{text-align:right;font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-weight:500;transition:background .15s}
.btn:hover{background:var(--muted-bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff} .btn.primary:hover{background:var(--primary-dark)}
.btn.green{background:var(--accent);border-color:var(--accent);color:#fff} .btn.green:hover{background:#047857}
.btn.danger{color:var(--danger);border-color:#F5C2C2} .btn.danger:hover{background:var(--danger-soft)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn.icon{width:40px;padding:0;justify-content:center} .btn.sm.icon{width:34px}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.f{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:12px}
label.f>span{display:block;margin-bottom:4px}
input,select,textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px} .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.err{background:var(--danger-soft);color:#991B1B;border-radius:8px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:18px}
.brand .logo{width:36px;height:36px;border-radius:9px;background:var(--fg);color:#fff;display:grid;place-items:center}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top .grow{flex:1;min-width:0}
.content{padding:24px;max-width:1300px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.kpi{padding:16px} .kpi .l{font-size:13px;color:var(--muted)} .kpi .v{font-family:var(--mono);font-weight:600;font-size:22px;margin-top:6px}
.kpi.g .v{color:#047857} .kpi.w .v{color:var(--warn)} .kpi.r .v{color:var(--danger)}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--muted-bg);color:var(--muted);white-space:nowrap}
.pill.blue{background:var(--primary-soft);color:var(--primary-dark)} .pill.green{background:var(--accent-soft);color:#047857}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.red{background:var(--danger-soft);color:#B91C1C}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 12px}
.toolbar input{flex:1;min-width:200px;width:auto}
.seg{display:inline-flex;background:var(--muted-bg);border-radius:8px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;min-height:32px;padding:0 12px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--fg);box-shadow:0 0 0 1px var(--border)}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--muted-bg);text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle}
th.num{text-align:right}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:16px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow-y:auto;padding:22px}
.modal .mh{display:flex;align-items:center;margin-bottom:14px} .modal .mh h2{flex:1}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:200}
.toast{background:var(--fg);color:#fff;padding:11px 16px;border-radius:9px;font-size:14px;max-width:340px} .toast.err{background:#B91C1C}
@media (max-width:700px){.top{padding:12px 16px}.content{padding:16px}.row2,.row3{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"><div class="auth"><div class="muted">Cargando…</div></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
'use strict';
/* Panel del dueño de la plataforma. Usa una sesión separada de dashboard.html.
   Todo el acceso real lo controla Supabase: solo el usuario registrado en la tabla
   platform_owner puede ejecutar las funciones owner_* (ver schema.sql). */
const SUPABASE_URL = 'https://qpsctrxhbhlbfmjopoti.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwc2N0cnhoYmhsYmZtam9wb3RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTg4ODUsImV4cCI6MjEwODI5NDg4NX0.VXrePNtCRS6npBmg4aXsiJ-IY1fImYuGGncUVoOWfYE';
const OWNER_DOMAIN = '@ukeiyo.app';   // el usuario "Ukeiyo" inicia sesión con ukeiyo@ukeiyo.app
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{storageKey:'sb-control-owner'}});

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0}).format(Number(n) || 0);
const fDay = d => new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'});
const fDT = d => new Date(d).toLocaleString('es-CO', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
const icons = {
  chart:'<path d="M3 3v18h18M7 14l4-4 4 4 5-6"/>', logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>', check:'<path d="M20 6 9 17l-5-5"/>', refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${icons[n] || ''}</svg>`;
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  $('#toasts').append(t); setTimeout(() => t.remove(), err ? 6000 : 3500);
}
const q = async p => { const r = await p; if (r.error) throw r.error; return r.data; };
async function run(fn, btn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { console.error(e); toast(e.message || 'Ocurrió un error', true); } finally { if (btn) btn.disabled = false; }
}
function modal(title, html) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2>
    <button class="btn icon sm" type="button" data-close aria-label="Cerrar">${ic('x')}</button></div><div>${html}</div></div>`;
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  ov.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', onKey); document.body.append(ov);
  const first = $('input,select,textarea', ov); if (first) first.focus();
  ov.close = close; return ov;
}
function confirmDlg(msg, okLabel, danger = true) {
  return new Promise(res => {
    const m = modal('Confirmar', `<p>${esc(msg)}</p><div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(okLabel)}</button></div>`);
    let done = false;
    m.addEventListener('click', e => { if (e.target.closest('[data-ok]')) { done = true; m.close(); res(true); } });
    new MutationObserver(() => { if (!document.body.contains(m) && !done) { done = true; res(false); } }).observe(document.body, {childList:true});
  });
}

/* ---------- estado ---------- */
const S = {rows:[], settings:null, filter:'todos', q:'', timer:null};
const todayBogota = () => new Date().toLocaleDateString('en-CA', {timeZone:'America/Bogota'});
const daysTo = d => Math.round((Date.parse(String(d).slice(0, 10) + 'T00:00:00Z') - Date.parse(todayBogota() + 'T00:00:00Z')) / 864e5);
function statusOf(r) {
  const days = daysTo(r.paid_until), warn = S.settings?.warn_days ?? 3;
  if (r.blocked) return {k:'bloqueado', label:'Bloqueado', pill:'red', days};
  if (days < 0) return {k:'vencido', label:'Vencido', pill:'red', days};
  if (days <= warn) return {k:'por_vencer', label:'Por vencer', pill:'warn', days};
  if (Number(r.payments_count) === 0) return {k:'nuevo', label:'Nuevo, sin pago', pill:'blue', days};
  return {k:'al_dia', label:'Al día', pill:'green', days};
}
const FILTERS = [['todos', 'Todos'], ['nuevo', 'Nuevos'], ['por_vencer', 'Por vencer'], ['vencido', 'Vencidos'], ['bloqueado', 'Bloqueados'], ['al_dia', 'Al día']];

async function load() {
  const [rows, settings] = await Promise.all([q(sb.rpc('owner_overview')), q(sb.rpc('owner_settings'))]);
  S.rows = rows; S.settings = settings;
}

/* ---------- acceso ---------- */
function renderLogin(msg) {
  clearInterval(S.timer);
  $('#root').innerHTML = `<div class="auth"><div class="auth-card"><div class="brand"><span class="logo">${ic('chart')}</span>Control de la plataforma</div>
    <form id="fL">${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <label class="f"><span>Usuario</span><input name="user" required autocomplete="username" autocapitalize="off"></label>
    <label class="f"><span>Contraseña</span><input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn primary" style="width:100%;justify-content:center" type="submit">Ingresar</button></form></div></div>`;
  $('#fL').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), btn = $('button', e.target), u = f.get('user').trim();
    btn.disabled = true;
    const {error} = await sb.auth.signInWithPassword({email:u.includes('@') ? u : u.toLowerCase() + OWNER_DOMAIN, password:f.get('password')});
    btn.disabled = false;
    if (error) renderLogin(error.message === 'Invalid login credentials' ? 'Usuario o contraseña incorrectos.' : error.message);
  };
}
async function boot() {
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return renderLogin();
  try {
    const {data, error} = await sb.rpc('owner_check');
    if (error) throw error;
    if (!data) { await sb.auth.signOut(); return renderLogin('Esta cuenta no tiene acceso al panel de control.'); }
    await load(); renderApp();
    clearInterval(S.timer); S.timer = setInterval(() => run(async () => { await load(); if (!$('.ov')) renderTable(); }), 60000);
  } catch (e) { console.error(e); renderLogin(e.message || 'No se pudo abrir el panel. ¿Ejecutaste schema.sql?'); }
}
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'SIGNED_OUT') renderLogin();
  else if (session && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) setTimeout(boot, 0);
  else if (ev === 'INITIAL_SESSION' && !session) renderLogin();
});

/* ---------- panel ---------- */
function renderApp() {
  $('#root').innerHTML = `<header class="top"><div class="brand" style="margin:0"><span class="logo">${ic('chart')}</span>Control de la plataforma</div><div class="grow"></div>
    <button class="btn sm" id="bRef">${ic('refresh')} Actualizar</button><button class="btn sm" id="bOut">${ic('logout')} Salir</button></header>
    <main class="content"><div class="grid kpis" id="kpis"></div>
    <div class="card" id="cfg"></div>
    <div class="toolbar"><div class="seg" id="seg" role="group" aria-label="Filtro"></div><input type="search" id="qs" placeholder="Buscar administrador, correo o grupo" aria-label="Buscar"></div>
    <div id="tbl"></div></main>`;
  $('#bOut').onclick = () => sb.auth.signOut();
  $('#bRef').onclick = () => run(async () => { await load(); renderApp2(); toast('Actualizado'); });
  $('#qs').oninput = e => { S.q = e.target.value; renderTable(); };
  renderApp2();
}
function renderApp2() { renderKpis(); renderSettings(); renderTable(); }
function renderKpis() {
  const st = S.rows.map(statusOf), c = k => st.filter(x => x.k === k).length;
  const kp = (l, v, cls = '') => `<div class="card kpi ${cls}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  $('#kpis').innerHTML = kp('Administradores', S.rows.length) + kp('Nuevos sin pago', c('nuevo')) + kp('Al día', c('al_dia'), 'g') + kp('Por vencer', c('por_vencer'), 'w')
    + kp('Vencidos o bloqueados', c('vencido') + c('bloqueado'), 'r') + kp('Total cobrado', money(S.rows.reduce((t, r) => t + Number(r.total_paid), 0)), 'g');
}
function renderSettings() {
  const s = S.settings;
  $('#cfg').innerHTML = `<h2 style="margin-bottom:12px">Mensualidad de los administradores</h2><form id="fCfg">
    <div class="row3"><label class="f"><span>Valor mensual (COP) — igual para todos</span><input name="price" type="number" min="0" step="1" required value="${s.monthly_price}"></label>
    <label class="f"><span>Días de plazo para el primer pago</span><input name="first" type="number" min="0" step="1" required value="${s.first_payment_days}"></label>
    <label class="f"><span>Avisar al administrador (días antes)</span><input name="warn" type="number" min="0" step="1" required value="${s.warn_days}"></label></div>
    <p class="hint">El nuevo valor se muestra a los administradores desde ahora. El plazo del primer pago solo aplica a registros nuevos.</p>
    <button class="btn primary" type="submit">Guardar</button></form>`;
  $('#fCfg').onsubmit = e => {
    e.preventDefault(); const f = new FormData(e.target);
    run(async () => { await q(sb.rpc('owner_update_settings', {p_price:Number(f.get('price')), p_first_days:Number(f.get('first')), p_warn_days:Number(f.get('warn'))}));
      await load(); renderApp2(); toast('Configuración guardada'); }, $('button', e.target));
  };
}
function renderTable() {
  const t = S.q.trim().toLowerCase();
  const rows = S.rows.map(r => ({r, s:statusOf(r)})).filter(({r, s}) => (S.filter === 'todos' || s.k === S.filter)
    && (!t || [r.admin_name, r.admin_email, r.group_name, r.admin_phone].some(v => (v || '').toLowerCase().includes(t))));
  const cnt = k => k === 'todos' ? S.rows.length : S.rows.filter(r => statusOf(r).k === k).length;
  $('#seg').innerHTML = FILTERS.map(([k, l]) => `<button data-f="${k}" class="${S.filter === k ? 'on' : ''}">${l} (${cnt(k)})</button>`).join('');
  $$('#seg [data-f]').forEach(b => b.onclick = () => { S.filter = b.dataset.f; renderTable(); });
  $('#tbl').innerHTML = rows.length ? `<div class="tw"><table><thead><tr><th>Administrador</th><th>Grupo</th><th>Registro</th><th>Vence</th><th class="num">Mensualidad</th><th class="num">Pagado</th><th>Estado</th><th></th></tr></thead><tbody>
    ${rows.map(({r, s}) => `<tr><td><b>${esc(r.admin_name || '—')}</b><div class="small muted">${esc(r.admin_email || '')}</div><div class="small muted">${esc(r.admin_phone || '')}</div></td>
      <td>${esc(r.group_name)}<div class="small muted">${r.sellers} vendedor(es)</div></td><td>${fDT(r.registered_at)}</td>
      <td>${fDay(r.paid_until)}<div class="small ${s.days < 0 ? '' : 'muted'}" style="${s.days < 0 ? 'color:var(--danger)' : ''}">${s.days < 0 ? `hace ${-s.days} día(s)` : s.days === 0 ? 'vence hoy' : `en ${s.days} día(s)`}</div></td>
      <td class="num">${money(S.settings.monthly_price)}</td><td class="num">${money(r.total_paid)}<div class="small muted" style="font-family:var(--font)">${r.payments_count} pago(s)</div></td>
      <td><span class="pill ${s.pill}">${s.label}</span></td>
      <td><div class="actions"><button class="btn green sm" data-act="pay" data-g="${r.group_id}">${ic('check')} Registrar pago</button>
        <button class="btn sm ${r.blocked ? '' : 'danger'}" data-act="block" data-g="${r.group_id}" data-b="${r.blocked ? 0 : 1}">${r.blocked ? 'Desbloquear' : 'Bloquear'}</button>
        <button class="btn sm" data-act="due" data-g="${r.group_id}">Vencimiento</button><button class="btn sm" data-act="hist" data-g="${r.group_id}">Historial</button></div></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="card empty">No hay administradores en este filtro.</div>';
}

/* ---------- acciones ---------- */
const rowOf = g => S.rows.find(r => r.group_id === g);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const r = rowOf(b.dataset.g); if (!r) return;
  ({pay, block, due, hist}[b.dataset.act])?.(r, b);
});
function pay(r) {
  const m = modal(`Registrar pago · ${r.group_name}`, `<p class="small muted" style="margin-top:0">Administrador: <b>${esc(r.admin_name)}</b>. Vence el ${fDay(r.paid_until)}.</p><form id="fP">
    <div class="row2"><label class="f"><span>Valor recibido (COP)</span><input name="amount" type="number" min="0" step="1" required value="${S.settings.monthly_price}"></label>
    <label class="f"><span>Meses que cubre</span><input name="months" type="number" min="1" max="24" step="1" required value="1"></label></div>
    <label class="f"><span>Nota (opcional)</span><input name="note" maxlength="120" placeholder="Transferencia, efectivo, referencia…"></label>
    <p class="hint">El nuevo vencimiento se cuenta desde la fecha actual de vencimiento (o desde hoy si ya venció). Se desbloquea al registrar el pago.</p>
    <div class="mf"><button type="button" class="btn" data-close>Cancelar</button><button class="btn green" type="submit">Registrar pago</button></div></form>`);
  $('#fP', m).onsubmit = e => {
    e.preventDefault(); const f = new FormData(e.target);
    run(async () => { await q(sb.rpc('owner_mark_paid', {p_group:r.group_id, p_amount:Number(f.get('amount')), p_months:Number(f.get('months')), p_note:f.get('note')}));
      m.close(); await load(); renderApp2(); toast('Pago registrado'); }, $('button[type=submit]', m));
  };
}
async function block(r, b) {
  const on = b.dataset.b === '1';
  if (!await confirmDlg(on ? `¿Bloquear a ${r.admin_name}? No podrá entrar y verá el mensaje de pago. Sus vendedores siguen trabajando.` : `¿Desbloquear a ${r.admin_name}?`, on ? 'Bloquear' : 'Desbloquear', on)) return;
  run(async () => { await q(sb.rpc('owner_set_blocked', {p_group:r.group_id, p_blocked:on})); await load(); renderApp2();
    toast(on ? 'Administrador bloqueado' : daysTo(r.paid_until) < 0 ? 'Desbloqueado, pero sigue vencido: registra el pago o cambia el vencimiento' : 'Administrador desbloqueado', false); });
}
function due(r) {
  const m = modal(`Cambiar vencimiento · ${r.group_name}`, `<form id="fD"><label class="f"><span>Nueva fecha de vencimiento</span><input name="d" type="date" required value="${String(r.paid_until).slice(0, 10)}"></label>
    <p class="hint">Úsalo para dar días de gracia o corregir una fecha. No registra ningún pago.</p>
    <div class="mf"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`);
  $('#fD', m).onsubmit = e => {
    e.preventDefault();
    run(async () => { await q(sb.rpc('owner_set_due', {p_group:r.group_id, p_date:new FormData(e.target).get('d')})); m.close(); await load(); renderApp2(); toast('Vencimiento actualizado'); }, $('button[type=submit]', m));
  };
}
function hist(r) {
  const m = modal(`Pagos · ${r.group_name}`, '<div class="muted">Cargando…</div>');
  run(async () => {
    const p = await q(sb.rpc('owner_payments', {p_group:r.group_id}));
    $('.modal > div:last-child', m).innerHTML = p.length ? `<div class="tw"><table><thead><tr><th>Fecha</th><th class="num">Valor</th><th>Cubre hasta</th><th>Nota</th></tr></thead><tbody>
      ${p.map(x => `<tr><td>${fDT(x.paid_at)}</td><td class="num">${money(x.amount)}</td><td>${fDay(x.period_end)} <span class="small muted">(${x.months} mes)</span></td><td>${esc(x.note || '')}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="empty">Todavía no hay pagos registrados.</div>';
  });
}
</script>
</body>
</html>
